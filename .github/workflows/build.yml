name: Build Textural VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (binaire universel Intel + Apple Silicon)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Signature locale (ad-hoc) et nettoyage
        run: |
          VST3=$(find build -type d -name "*.vst3" | head -n 1)
          echo "Plugin trouvé : $VST3"
          xattr -cr "$VST3"
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict "$VST3"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "dist/$(basename "$VST3" .vst3)-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: dist/*.zip
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure (CMake + Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/Textural_artefacts/Release/VST3/Textural.vst3" "dist/Textural.vst3"
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Build installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Textural-VST3-Windows
          path: dist/Textural.vst3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Textural-Setup-Windows
          path: dist/Textural-Setup.exe
          if-no-files-found: warn

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/Textural-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Textural-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "Textural-VST3-Windows.zip" "Textural.vst3"
          pack dist/mac "Textural-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" Textural-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Textural-VST3-Windows.zip Textural-VST3-macOS.zip"
          [ -f Textural-Notice.pdf ] && FILES="$FILES Textural-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Textural $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
